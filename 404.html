<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Completionist</title>
<meta name="theme-color" content="#06070d">

<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="/assets/css/base.css">

<style>
  body {
    display: grid;
    place-content: center;
    gap: 1rem;
    min-height: 100vh;
    padding: 2rem 1.5rem;
    text-align: center;
    background:
      radial-gradient(900px 600px at 50% -10%, rgba(124, 92, 255, 0.22), transparent 62%),
      radial-gradient(800px 600px at 50% 110%, rgba(61, 220, 151, 0.12), transparent 62%),
      linear-gradient(180deg, #06070d, #03040a);
    color: #edeff7;
    font-family: 'Manrope', system-ui, sans-serif;
  }

  .code {
    font-size: clamp(5rem, 22vw, 11rem);
    font-weight: 800;
    line-height: 0.9;
    letter-spacing: -0.06em;
    background: linear-gradient(103deg, #4ddbff, #7c5cff 55%, #ff7bd5);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; }

  p { max-width: 42ch; margin-inline: auto; color: #8a90a8; }

  .home {
    justify-self: center;
    margin-top: 0.8rem;
    padding: 0.65rem 1.4rem;
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    color: #edeff7;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    transition: background 0.25s, border-color 0.25s;
  }

  .home:hover {
    background: rgba(124, 92, 255, 0.22);
    border-color: rgba(124, 92, 255, 0.6);
  }
</style>
</head>
<body>
  <div class="code">404</div>
  <h1>Такой страницы в коллекции нет</h1>
  <p>Возможно, игра ещё не добавлена или ссылка устарела.</p>
  <a class="home" href="/">Вернуться к коллекции</a>
</body>
</html>
