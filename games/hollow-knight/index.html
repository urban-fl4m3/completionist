<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hollow Knight — Completionist</title>
<meta name="description" content="Цели комплишениста по Hollow Knight: 112%, амулеты, Пантеоны и Steel Soul.">
<meta name="theme-color" content="#050912">

<link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Quicksand:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-game="hollow-knight">

<canvas id="spores" aria-hidden="true"></canvas>
<div class="depths" aria-hidden="true"></div>
<div class="lantern" aria-hidden="true"></div>

<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <defs>
    <linearGradient id="hkGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c9a0ff"/>
      <stop offset="100%" stop-color="#7fd4e8"/>
    </linearGradient>
  </defs>
</svg>

<a class="back" href="../../">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M19 12H5M11 18l-6-6 6-6"/>
  </svg>
  <span>к коллекции</span>
</a>

<!-- ========================= Шапка ========================= -->
<header class="gate">
  <div class="gate__inner">
    <p class="gate__status">ещё не начато</p>

    <h1 class="gate__title">Hollow&nbsp;Knight</h1>

    <p class="gate__sub">Team Cherry · 2017 · PC</p>

    <!-- Спящее кольцо прогресса -->
    <div class="orb">
      <span class="orb__aura" aria-hidden="true"></span>
      <span class="orb__aura orb__aura--slow" aria-hidden="true"></span>

      <div class="orb__ring" data-ring data-ring-size="210" data-ring-width="3"></div>

      <div class="orb__core">
        <span class="orb__pct" data-progress-pct>0</span>
        <span class="orb__unit">процентов</span>
        <span class="orb__sub">
          <b data-progress-done>0</b> из <span data-progress-total>0</span> целей
        </span>
      </div>
    </div>

    <p class="gate__quote">
      Стоит в библиотеке третий год. Пора.
    </p>

    <dl class="runes">
      <div><dt>цель</dt><dd>112%</dd></div>
      <div><dt>амулетов</dt><dd>45</dd></div>
      <div><dt>концовок</dt><dd>5</dd></div>
      <div><dt>пантеонов</dt><dd>5</dd></div>
    </dl>
  </div>
</header>

<!-- ========================= Цели ========================= -->
<main class="hall">
  <div class="hall__head">
    <h2 class="hall__title">Путь</h2>

    <div class="hall__tools">
      <span class="local" data-local-badge hidden>
        <i aria-hidden="true"></i>есть несохранённые отметки
      </span>
      <button type="button" class="btn" data-export>Скопировать состояние</button>
      <button type="button" class="btn btn--ghost" data-reset>Сбросить</button>
    </div>
  </div>

  <div class="hall__bar" aria-hidden="true">
    <div class="hall__fill" data-progress-bar></div>
  </div>

  <div class="hall__body" data-goals></div>
</main>

<footer class="foot">
  <span>Completionist</span>
  <a href="../../">вернуться к коллекции</a>
</footer>

<script src="../../data/games.js"></script>
<script src="../../assets/js/core.js"></script>
<script src="../../assets/js/game.js"></script>
<script src="fx.js"></script>
</body>
</html>
