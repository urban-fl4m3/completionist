<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elden Ring — Completionist</title>
<meta name="description" content="Цели комплишениста по Elden Ring: концовки, боссы, коллекционные предметы и платина.">
<meta name="theme-color" content="#0b0804">

<link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-game="elden-ring">

<!-- Угли, поднимающиеся от земли -->
<canvas id="embers" aria-hidden="true"></canvas>
<div class="fog" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<!-- Градиент для кольца прогресса (SVG рисует assets/js/game.js) -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <defs>
    <linearGradient id="erGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#f3d99b"/>
      <stop offset="50%"  stop-color="#d4a44c"/>
      <stop offset="100%" stop-color="#ff7b3d"/>
    </linearGradient>
  </defs>
</svg>

<a class="back" href="../../">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M19 12H5M11 18l-6-6 6-6"/>
  </svg>
  <span>К коллекции</span>
</a>

<!-- ========================= Шапка ========================= -->
<header class="crest">
  <!-- Кадр из игры, утопленный в золото и темноту -->
  <div class="crest__art" aria-hidden="true"></div>

  <div class="crest__inner">
    <p class="crest__status">
      <span class="crest__rule" aria-hidden="true"></span>
      Пройдено полностью
      <span class="crest__rule" aria-hidden="true"></span>
    </p>

    <!-- Официальный логотип подменяет текст, если загрузился -->
    <div class="crest__logo" data-logo></div>
    <h1 class="crest__title">Elden Ring</h1>

    <p class="crest__sub">FromSoftware · 2022 · PC</p>

    <nav class="crest__links" data-links aria-label="Ссылки по игре"></nav>

    <!-- Кольцо прогресса в золотой рамке -->
    <div class="seal">
      <div class="seal__frame" data-ring data-ring-size="200" data-ring-width="7"></div>
      <div class="seal__core">
        <span class="seal__pct"><b data-progress-pct>0</b><i>%</i></span>
        <span class="seal__sub">
          <b data-progress-done>0</b> / <span data-progress-total>0</span> целей
        </span>
      </div>
    </div>

    <dl class="ledger">
      <div><dt>Часов</dt><dd>143</dd></div>
      <div><dt>Оценка</dt><dd>10<span>/10</span></dd></div>
      <div><dt>Начато</dt><dd>2 ноя 2025</dd></div>
      <div><dt>Закрыто</dt><dd>18 янв 2026</dd></div>
    </dl>

    <blockquote class="verdict">
      Закрыто на 100%: все концовки, все боссы, полная платина.
      Лучший открытый мир, который я видел.
    </blockquote>
  </div>
</header>

<!-- ========================= Цели ========================= -->
<main class="scroll">
  <div class="scroll__head">
    <h2 class="scroll__title">Список целей</h2>

  </div>

  <div class="scroll__bar" aria-hidden="true">
    <div class="scroll__fill" data-progress-bar></div>
  </div>

  <div class="scroll__body" data-goals></div>
</main>

<footer class="foot">
  <span>Completionist</span>
  <a href="../../">Вернуться к коллекции</a>
</footer>

<script src="../../data/games.js"></script>
<script src="../../assets/js/core.js"></script>
<script src="../../assets/js/game.js"></script>
<script src="fx.js"></script>
</body>
</html>
