<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyberpunk 2077 — Completionist</title>
<meta name="description" content="Цели комплишениста по Cyberpunk 2077: сюжет, Phantom Liberty, фиксеры и коллекционные предметы.">
<meta name="theme-color" content="#07070a">

<link rel="icon" href="../../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-game="cyberpunk-2077">

<canvas id="rain" aria-hidden="true"></canvas>
<div class="scanlines" aria-hidden="true"></div>
<div class="glow" aria-hidden="true"></div>

<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <defs>
    <linearGradient id="cpGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#fcee0a"/>
    </linearGradient>
  </defs>
</svg>

<a class="back" href="../../">
  <span aria-hidden="true">&lt;&lt;</span> EXIT_TO_COLLECTION
</a>

<!-- ========================= HUD-шапка ========================= -->
<header class="hud">
  <div class="hud__frame">
    <span class="hud__corner hud__corner--tl" aria-hidden="true"></span>
    <span class="hud__corner hud__corner--tr" aria-hidden="true"></span>
    <span class="hud__corner hud__corner--bl" aria-hidden="true"></span>
    <span class="hud__corner hud__corner--br" aria-hidden="true"></span>

    <p class="hud__tag">
      <span class="hud__dot" aria-hidden="true"></span>
      STATUS: IN_PROGRESS
    </p>

    <h1 class="glitch" data-text="CYBERPUNK 2077">
      <span>CYBERPUNK</span><b>2077</b>
    </h1>

    <p class="hud__sub">CD PROJEKT RED // 2020 // PC</p>

    <div class="hud__grid">
      <!-- Левая колонка: телеметрия -->
      <dl class="telemetry">
        <div><dt>TIME_PLAYED</dt><dd>61<span>h</span></dd></div>
        <div><dt>RATING</dt><dd>9<span>/10</span></dd></div>
        <div><dt>STARTED</dt><dd>04.09.26</dd></div>
        <div><dt>STREET_CRED</dt><dd>43<span>/60</span></dd></div>
      </dl>

      <!-- Правая колонка: кольцо -->
      <div class="meter">
        <div class="meter__ring" data-ring data-ring-size="178" data-ring-width="5"></div>
        <div class="meter__core">
          <span class="meter__pct" data-progress-pct>0</span>
          <span class="meter__unit">% COMPLETE</span>
          <span class="meter__sub">
            <b data-progress-done>0</b>/<span data-progress-total>0</span> OBJECTIVES
          </span>
        </div>
      </div>
    </div>

    <p class="hud__note">// Идёт второй акт. Phantom Liberty ещё не трогал.</p>
  </div>
</header>

<!-- ========================= Контракты ========================= -->
<main class="deck">
  <div class="deck__head">
    <h2 class="deck__title">
      <span aria-hidden="true">▚</span> OBJECTIVE_LIST
    </h2>

    <div class="deck__tools">
      <span class="local" data-local-badge hidden>
        <i aria-hidden="true"></i>UNSAVED_LOCAL
      </span>
      <button type="button" class="btn" data-export>COPY_STATE</button>
      <button type="button" class="btn btn--ghost" data-reset>RESET</button>
    </div>
  </div>

  <div class="deck__bar" aria-hidden="true">
    <div class="deck__fill" data-progress-bar></div>
  </div>

  <div class="deck__body" data-goals></div>
</main>

<footer class="foot">
  <span>COMPLETIONIST_OS v1.0</span>
  <a href="../../">&lt;&lt; RETURN</a>
</footer>

<script src="../../data/games.js"></script>
<script src="../../assets/js/core.js"></script>
<script src="../../assets/js/game.js"></script>
<script src="fx.js"></script>
</body>
</html>
