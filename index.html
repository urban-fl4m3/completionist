<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Completionist — коллекция игр</title>
<meta name="description" content="Личный трекер прохождения игр: статусы, цели комплишениста и статистика по коллекции.">
<meta name="theme-color" content="#06070d">

<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.cloudflare.steamstatic.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/hub.css">
<link rel="stylesheet" href="assets/css/boot.css">
</head>
<body>

<div class="backdrop" aria-hidden="true"></div>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<!-- ===================== Верхняя панель ===================== -->
<header class="topbar">
  <div class="shell topbar__inner">
    <a class="brand" href="./">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 21h8M12 17v4M6 4h12v4a6 6 0 0 1-12 0z"/>
          <path d="M18 5h2a2 2 0 0 1 0 4h-1M6 5H4a2 2 0 0 0 0 4h1"/>
        </svg>
      </span>
      <span class="brand__text">Completionist<span>.</span></span>
    </a>

    <!-- Вся статистика коллекции — одной компактной полосой -->
    <div class="ticker" data-ticker></div>
  </div>
</header>

<main>
  <!-- ======================== Коллекция ======================== -->
  <!-- Витрина: игра, которая идёт прямо сейчас -->
  <section class="shell" data-stage></section>

  <section class="shell">
    <h1 class="sr-only">Коллекция игр</h1>

    <div class="toolbar">
      <div class="filters" data-filters role="group" aria-label="Фильтр по статусу"></div>

      <div class="toolbar__spacer"></div>

      <label class="search">
        <span class="sr-only">Поиск по коллекции</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/>
        </svg>
        <input type="search" placeholder="Поиск…  /" data-search
               autocomplete="off" spellcheck="false">
      </label>

      <label>
        <span class="sr-only">Сортировка</span>
        <select class="sort" data-sort>
          <option value="recent">Сначала свежие</option>
          <option value="progress">По прогрессу</option>
          <option value="status">По статусу</option>
          <option value="hours">По часам</option>
          <option value="rating">По оценке</option>
          <option value="title">По алфавиту</option>
        </select>
      </label>
    </div>

    <div class="mosaic" data-collection></div>
  </section>
</main>

<footer class="footer">
  <div class="shell footer__inner">
    <span>Completionist · <span data-visible-count>0 игр</span> в выборке</span>
    <span>
      Данные —
      <a href="https://github.com/urban-fl4m3/completionist/blob/main/data/games.js"
         target="_blank" rel="noopener">data/games.js</a> ·
      <span data-year>2026</span>
    </span>
  </div>
</footer>

<script src="data/games.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/boot.js"></script>
<script src="assets/js/hub.js"></script>
</body>
</html>
